  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .courses-hero {
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-soft) 100%);
      padding: 48px 0 40px;
      margin-bottom: 32px;
    }
    .courses-hero h1 { color: var(--white); font-size: 2rem; font-weight: 900; }
    .courses-hero p  { color: rgba(255,255,255,.5); margin-top: 6px; }

    .course-grid-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow .2s;
    }
    .course-grid-card:hover { box-shadow: var(--shadow-md); }
    .course-grid-card .stripe { height: 4px; background: var(--orange); }
    .course-grid-card .body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .course-grid-card .icon { font-size: 2.4rem; margin-bottom: 12px; }
    .course-grid-card .row  { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .course-grid-card h3    { font-size: 1.1rem; font-weight: 800; }
    .course-grid-card p     { color: var(--text-muted); font-size: .88rem; line-height: 1.6; flex: 1; margin-bottom: 14px; }
    .course-meta-row        { display: flex; gap: 14px; font-size: .8rem; color: var(--text-muted); margin-bottom: 16px; }
    .enrolled-tag { background: var(--green-light); color: #166534; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 100px; }
  </style>
</head>
