<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Codera</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, var(--dark) 0%, #3a200e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-box {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
    }
    .auth-logo { display:flex;align-items:center;gap:10px;margin-bottom:28px; }
    .auth-logo-icon { width:40px;height:40px;background:var(--orange);border-radius:10px;display:flex;align-items:center;justify-content:center; }
    .auth-logo-name { font-weight:800;font-size:1.15rem; }
    .auth-box h2 { font-size:1.5rem;font-weight:900;margin-bottom:4px; }
    .auth-box p.sub { color:var(--text-muted);font-size:.9rem;margin-bottom:24px; }
    .auth-footer { text-align:center;margin-top:20px;font-size:.9rem;color:var(--text-muted); }
    .auth-footer a { color:var(--orange);font-weight:700; }
  </style>
</head>
<body>

  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </div>
      <span class="auth-logo-name">Codera</span>
    </div>

    <h2>Create your account</h2>
    <p class="sub">Join Codera and start your learning journey today.</p>

    <div class="alert alert-error" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Your full name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" placeholder="Repeat your password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top:8px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
    <div class="auth-footer" style="margin-top:8px;">
      <a href="../index.html" style="color:var(--text-muted);font-size:.82rem;">← Back to Home</a>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.textContent = "Creating account…";
      btn.disabled = true;

      const full_name        = document.getElementById("full_name").value.trim();
      const email            = document.getElementById("email").value.trim();
      const password         = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;

      if (password !== confirm_password) {
        showAlert("error-msg", "Passwords do not match.");
        btn.textContent = "Create Account";
        btn.disabled = false;
        return;
      }

      try {
        const res  = await fetch("../php/signup.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name, email, password, confirm_password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert("success-msg", "Account created! Redirecting to dashboard…");
          setTimeout(() => { window.location.href = "dashboard.html"; }, 900);
        } else {
          showAlert("error-msg", data.message || "Registration failed.");
          btn.textContent = "Create Account";
          btn.disabled = false;
        }
      } catch {
        showAlert("error-msg", "Network error. Make sure XAMPP is running.");
        btn.textContent = "Create Account";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
