<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Problems — Codera</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/topbar.css" />
  <style>
    .problems-hero {
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-soft) 100%);
      padding: 48px 0 40px; margin-bottom: 32px;
    }
    .problems-hero h1 { color:var(--white); font-size:2rem; font-weight:900; }
    .problems-hero p  { color:rgba(255,255,255,.5); margin-top:6px; }

    .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    .filter-btn { padding:7px 18px; border-radius:100px; font-size:.82rem; font-weight:700; border:1.5px solid var(--border); background:var(--white); cursor:pointer; transition:all .15s; }
    .filter-btn:hover  { border-color:var(--orange); color:var(--orange); }
    .filter-btn.active { background:var(--orange); color:var(--white); border-color:var(--orange); }

    .problem-list-item {
      display:flex; align-items:center; gap:16px;
      padding:16px 20px; background:var(--white); border-radius:var(--radius);
      border:1px solid var(--border); margin-bottom:10px; cursor:pointer;
      transition:box-shadow .15s;
    }
    .problem-list-item:hover { box-shadow:var(--shadow); }
    .problem-list-item h4 { font-weight:700; font-size:.95rem; margin-bottom:3px; }
    .problem-num { width:36px; height:36px; border-radius:50%; background:rgba(236,91,19,.1); color:var(--orange); font-weight:700; font-size:.82rem; display:flex;align-items:center;justify-content:center; flex-shrink:0; }

    /* Problem detail modal */
    .problem-detail { max-width:740px; }
    .problem-detail h2 { font-size:1.3rem; font-weight:800; margin-bottom:8px; }
    .problem-detail h4 { font-weight:700; margin:16px 0 6px; color:var(--orange); }
    .problem-detail p  { font-size:.93rem; line-height:1.7; color:var(--text); }
    .problem-detail pre {
      background:#1e1e2e; color:#cdd6f4; border-radius:var(--radius);
      padding:16px 20px; font-family:'Courier New',monospace; font-size:.85rem; margin:8px 0;
    }
    .hint-box {
      background:#fef3c7; border:1px solid #fcd34d; border-radius:var(--radius);
      padding:12px 16px; font-size:.88rem; margin:8px 0;
    }

    .code-editor {
      width:100%; min-height:180px; resize:vertical; box-sizing:border-box;
      background:#1e1e2e; color:#cdd6f4; border:1px solid #313244; border-radius:var(--radius);
      padding:14px 16px; font-family:'Courier New',monospace; font-size:.88rem; line-height:1.5;
      tab-size:2;
    }
    .code-editor:focus { outline:2px solid var(--orange); border-color:var(--orange); }

    .judge-banner { padding:10px 14px; border-radius:var(--radius); font-size:.9rem; font-weight:700; margin-bottom:10px; }
    .judge-banner.pass { background:#f0fdf4; color:#166534; border:1px solid #86efac; }
    .judge-banner.fail { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }
    .judge-banner.info { background:#eff6ff; color:#1e40af; border:1px solid #93c5fd; }

    .judge-row { padding:10px 12px; border-radius:8px; margin-bottom:8px; font-size:.85rem; line-height:1.5; }
    .judge-row.pass { background:#f0fdf4; border-left:3px solid #22c55e; }
    .judge-row.fail { background:#fef2f2; border-left:3px solid #ef4444; }
    .judge-row code { background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; }

    .history-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:.85rem; }
    .history-row:last-child { border-bottom:none; }
  </style>
</head>
<body>

  <nav class="topbar">
    <a href="dashboard.html" class="topbar-logo">
      <div class="topbar-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </div>
      <span class="topbar-logo-name">Codera</span>
    </a>
    <div class="topbar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="problems.html" class="active">Problems</a>
      <a href="visualizer.html">Visualizer</a>
      <a href="community.html">Community</a>
    </div>
    <div class="topbar-right"></div>
  </nav>

  <div class="page-wrapper">
    <div class="problems-hero">
      <div class="container">
        <p class="section-label">Practice</p>
        <h1>Coding Problems</h1>
        <p>Sharpen your programming skills with curated challenges.</p>
      </div>
    </div>

    <div class="container" style="padding-bottom:48px;">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterProblems('all', this)">All</button>
        <button class="filter-btn" onclick="filterProblems('Easy', this)">Easy</button>
        <button class="filter-btn" onclick="filterProblems('Medium', this)">Medium</button>
        <button class="filter-btn" onclick="filterProblems('Hard', this)">Hard</button>
      </div>
      <div id="problems-list">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- Problem detail modal -->
  <div class="modal-overlay" id="problem-modal">
    <div class="modal problem-detail">
      <button class="modal-close" onclick="closeModal('problem-modal')">✕</button>
      <h2 id="modal-title">—</h2>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <span class="badge" id="modal-badge">—</span>
      </div>
      <h4>Description</h4>
      <p id="modal-desc">—</p>
      <h4>Example</h4>
      <div>
        <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:4px;">Input:</p>
        <pre id="modal-input">—</pre>
        <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:4px;">Output:</p>
        <pre id="modal-output">—</pre>
      </div>
      <h4>Hint</h4>
      <div class="hint-box" id="modal-hint">—</div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <h4 style="margin:0;">Your Code</h4>
        <select id="lang-select" onchange="onLanguageChange()" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-weight:700;font-size:.85rem;">
          <option value="javascript">JavaScript</option>
          <option value="c">C</option>
          <option value="cpp">C++</option>
        </select>
      </div>
      <textarea id="code-editor" class="code-editor" spellcheck="false" placeholder="// Write your function here, then Run against the example or Submit to check it against all test cases."></textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <button class="btn btn-outline-dark btn-sm" id="run-btn" onclick="runCode()">▶ Run</button>
        <button class="btn btn-primary btn-sm" id="submit-btn" onclick="submitCode()">Submit</button>
        <span id="judge-status" class="text-muted text-sm"></span>
      </div>
      <div id="judge-results" style="margin-top:14px;"></div>

      <div style="margin-top:20px;">
        <h4 style="cursor:pointer;user-select:none;" onclick="toggleHistory()">📜 Submission History <span id="history-toggle-icon">▾</span></h4>
        <div id="submission-history" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/topbar.js"></script>
  <script src="../js/problems.js"></script>
</body>
</html>
